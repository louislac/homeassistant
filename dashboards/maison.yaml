title: Maison

views:
  - title: Maison
    path: maison
    icon: mdi:home
    type: sections
    max_columns: 2
    dense_section_placement: true
    badges:
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: person.louis
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: person.julie
      - type: entity
        entity: sensor.temperature_maison
      - type: entity
        entity: sensor.humidite_maison
      - type: entity
        entity: weather.forecast_maison
        show_name: false
        show_state: true
        show_icon: true
        state_content:
          - state
          - temperature
      - type: entity
        entity: sensor.immich_backup_status
        name: Backup Immich
        icon: phu:immich
        visibility:
          - condition: state
            entity: sensor.immich_backup_status
            state_not:
              - SUCCESS
              - RUNNING
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: area
                area: salon
                display_type: compact
                sensor_classes: [temperature, humidity]
                features:
                  - type: area-controls
                    controls:
                      - light
                  - type: area-controls
                    controls:
                      - entity_id: light.0xc09b9efffe451c5a
                      - entity_id: light.light_cuisine
                  - type: area-controls
                    controls:
                      - entity_id: light.light_entree
                      - entity_id: light.light_salon
                      - entity_id: light.plug_tulipe
                  - type: area-controls
                    controls:
                      - cover-shade
                tap_action:
                  action: navigate
                  navigation_path: /home/areas-salon
              - type: area
                area: chambre_emil
                display_type: compact
                sensor_classes: [temperature, humidity]
                features:
                  - type: area-controls
                    controls:
                      - entity_id: light.light_emil_day
                      - entity_id: light.light_emil_night
                  - type: area-controls
                    controls:
                      - cover-shade
                tap_action:
                  action: navigate
                  navigation_path: /home/areas-chambre_emil
            grid_options:
              columns: 6
          - type: vertical-stack
            cards:
              - type: area
                area: chambre
                display_type: compact
                sensor_classes: [temperature, humidity]
                features:
                  - type: area-controls
                    controls:
                      - entity_id: light.light_chambre
                  - type: area-controls
                    controls:
                      - entity_id: light.chambre_light_chambre_chevet_julie
                      - entity_id: light.chambre_light_chambre_chevet_louis
                  - type: area-controls
                    controls:
                      - cover-shade
                tap_action:
                  action: navigate
                  navigation_path: /home/areas-chambre
              - type: area
                area: bureau
                display_type: compact
                sensor_classes: [temperature, humidity]
                features:
                  - type: area-controls
                    controls:
                      - light
                  - type: area-controls
                    controls:
                      - entity_id: light.light_bureau_julie
                      - entity_id: switch.smart_plug_20072968373619251h5448e1e927f179_outlet
                  - type: area-controls
                    controls:
                      - cover-shade
                tap_action:
                  action: navigate
                  navigation_path: /home/areas-bureau
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: tile
            entity: cover.groupe_cover_all
            name: Tous les volets
            features:
              - type: cover-open-close
            grid_options:
              columns: 6
          - type: tile
            entity: vacuum.romo
            name: Aspirateur
            features:
              - type: vacuum-commands
                commands: [start_pause, stop, return_home]
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: tile
            entity: select.harmony_hub_activites
            name: Harmony
            features:
              - type: select-options
            grid_options:
              columns: 6
          - type: tile
            entity: media_player.denon_avc_x3700h
            name: Denon
            tap_action:
              action: more-info
            icon_tap_action:
              action: toggle
            features:
              - type: media-player-volume-slider
            grid_options:
              columns: 6

      - type: grid
        title: Chauffage
        visibility:
          - condition: state
            entity: climate.thermostat_navilink_connect_chauffage
            state: heat
        cards:
          - type: thermostat
            entity: climate.thermostat_navilink_connect_chauffage
            name: Chauffage
            grid_options:
              columns: 12

      - type: grid
        title: Alertes
        visibility:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.door_entree_contact
                state: "on"
              - condition: state
                entity: binary_sensor.porte_fenetre_gauche
                state: "on"
              - condition: state
                entity: binary_sensor.window_salon_right_porte
                state: "on"
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.door_entree_contact
                state: "on"
            card:
              type: tile
              entity: binary_sensor.door_entree_contact
              name: Porte d'entrée ouverte
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.porte_fenetre_gauche
                state: "on"
            card:
              type: tile
              entity: binary_sensor.porte_fenetre_gauche
              name: Porte-fenêtre gauche ouverte
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.window_salon_right_porte
                state: "on"
            card:
              type: tile
              entity: binary_sensor.window_salon_right_porte
              name: Porte-fenêtre droite ouverte

  - title: Système
    path: systeme
    icon: mdi:server
    type: sections
    max_columns: 2
    badges:
      - type: entity
        entity: sensor.temp_homelab_temperature
    sections:
      - type: grid
        title: Frigost
        cards:
          - type: tile
            entity: binary_sensor.frigost_statut
            name: Frigost
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.plug_serveur_frigost_power
            name: Puissance
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.frigost_automatique
            name: Gestion automatique
            grid_options:
              columns: 6
          - type: tile
            entity: input_boolean.frigost_weekend_automatique
            name: Week-end automatique
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.frigost_heure_demarrage
            name: Démarrage semaine
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.frigost_heure_arret
            name: Arrêt semaine
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.frigost_heure_demarrage_weekend
            name: Démarrage week-end
            grid_options:
              columns: 6
          - type: tile
            entity: input_datetime.frigost_heure_arret_weekend
            name: Arrêt week-end
            grid_options:
              columns: 6
          - type: tile
            entity: script.frigost_demarrer
            name: Démarrer
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.frigost_demarrer
            grid_options:
              columns: 4
          - type: tile
            entity: script.frigost_redemarrer
            name: Redémarrer
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.frigost_redemarrer
              confirmation:
                title: Redémarrer Frigost ?
                text: Le serveur et Apps seront temporairement indisponibles.
            grid_options:
              columns: 4
          - type: tile
            entity: script.frigost_arreter
            name: Arrêter
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.frigost_arreter
              confirmation:
                title: Arrêter Frigost ?
                text: Le backup Immich reste protégé pendant l'arrêt.
            grid_options:
              columns: 4

      - type: grid
        title: Immich
        cards:
          - type: tile
            entity: sensor.immich_backup_status
            name: Backup
            icon: phu:immich
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.immich_backup_last_success
            name: Dernier succès
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.immich_backup_duration
            name: Durée
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.immich_backup_onedrive_free
            name: OneDrive libre
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.immich_backup_dump_age
            name: Âge du dump
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.immich_backup_snapshot
            name: Dernier snapshot
            grid_options:
              columns: 12
          - type: tile
            entity: sensor.immich_backup_last_failure
            name: Dernier échec
            grid_options:
              columns: 12

  - title: Chauffage
    path: chauffage
    icon: mdi:radiator
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Thermostat principal
            icon: mdi:thermostat
          - type: thermostat
            entity: climate.thermostat_navilink_connect_chauffage
            name: Salon
            grid_options:
              columns: 12
              rows: 5
          - type: tile
            entity: sensor.thermostat_navilink_connect_duree_delegation_restante_z1
            name: Dérogation restante
            icon: mdi:clock-outline
            visibility:
              - condition: state
                entity: climate.thermostat_navilink_connect_chauffage
                attribute: preset_mode
                state: override
            grid_options:
              columns: 6
          - type: button
            name: Reprendre la programmation
            icon: mdi:calendar-sync
            show_state: false
            tap_action:
              action: perform-action
              perform_action: climate.set_preset_mode
              target:
                entity_id: climate.thermostat_navilink_connect_chauffage
              data:
                preset_mode: prog
              confirmation:
                title: Reprendre la programmation ?
                text: La dérogation temporaire en cours sera arrêtée.
            grid_options:
              columns: 6
          - type: tile
            entity: number.thermostat_navilink_connect_duree_delegation_z1
            name: Durée de dérogation
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Programmation hebdomadaire
            icon: mdi:calendar-week
          - type: markdown
            content: >-
              La programmation native est affichée ci-dessous. Son édition depuis
              Home Assistant n'est pas disponible avec Cozytouch 1.4.0 ; les
              horaires ne sont pas modifiés par cette vue.
            grid_options:
              columns: 12
          - type: entities
            title: Programme Zone 1
            show_header_toggle: false
            entities:
              - entity: sensor.thermostat_navilink_connect_prog_01_lun_z1
                name: Lundi
              - entity: sensor.thermostat_navilink_connect_prog_02_mar_z1
                name: Mardi
              - entity: sensor.thermostat_navilink_connect_prog_03_mer_z1
                name: Mercredi
              - entity: sensor.thermostat_navilink_connect_prog_04_jeu_z1
                name: Jeudi
              - entity: sensor.thermostat_navilink_connect_prog_05_ven_z1
                name: Vendredi
              - entity: sensor.thermostat_navilink_connect_prog_06_sam_z1
                name: Samedi
              - entity: sensor.thermostat_navilink_connect_prog_07_dim_z1
                name: Dimanche
            grid_options:
              columns: 12

      - type: grid
        cards:
          - type: heading
            heading: Chaudière
            icon: mdi:fire
          - type: tile
            entity: sensor.thermostat_navilink_connect_flamme
            name: Flamme
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.thermostat_navilink_connect_cozytouch
            name: Connexion Cozytouch
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.thermostat_navilink_connect_temperature_chaudiere
            name: Température chaudière
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.unknown_product_62_temperature_ecs
            name: Température ECS
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.unknown_product_62_pression_eau
            name: Pression circuit
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.thermostat_navilink_connect_pompe_ecs
            name: Pompe ECS
            grid_options:
              columns: 6

      - type: grid
        cards:
          - type: heading
            heading: Consommation et suivi
            icon: mdi:chart-line
          - type: tile
            entity: sensor.unknown_product_62_consommation_ch
            name: Chauffage
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.unknown_product_62_consommation_ecs
            name: Eau chaude sanitaire
            grid_options:
              columns: 6
          - type: history-graph
            title: Température et consigne
            hours_to_show: 24
            entities:
              - entity: sensor.thermostat_navilink_connect_temperature_thermostat_z1
                name: Ambiante
              - entity: number.thermostat_navilink_connect_temperature_consigne
                name: Consigne
            grid_options:
              columns: 12
              rows: 4
          - type: history-graph
            title: Fonctionnement
            hours_to_show: 24
            entities:
              - entity: sensor.thermostat_navilink_connect_flamme
                name: Flamme
              - entity: binary_sensor.thermostat_navilink_connect_cozytouch
                name: Connexion
            grid_options:
              columns: 12
              rows: 4
