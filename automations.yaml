- id: '1774710421869'
  alias: bilrsea terracotta
  description: ''
  triggers:
  - event_type: state_changed
    id: btn1
    event_data:
      entity_id: event.bilresa_terracotta_bouton_1
    trigger: event
  - event_type: state_changed
    id: btn2
    event_data:
      entity_id: event.bilresa_terracotta_bouton_2
    trigger: event
  conditions: []
  actions:
  - variables:
      event_type: '{{ trigger.event.data.new_state.attributes.event_type }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''btn1'' and event_type == ''multi_press_1''
          }}

          '
      sequence:
      - action: light.turn_on
        data:
          brightness: '{{ states(''input_number.last_brightness_chambre'') | int(150)
            }}

            '
        target:
          entity_id: light.light_chambre
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''btn2'' and event_type == ''multi_press_1''
          }}

          '
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.last_brightness_chambre
        data:
          value: '{{ state_attr(''light.light_chambre'', ''brightness'') or 150 }}

            '
      - action: light.turn_off
        data: {}
        target:
          entity_id: light.light_chambre
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''btn1'' and event_type == ''long_press''
          }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            data:
              brightness_step: 25
            target:
              entity_id: light.light_chambre
          - delay: '00:00:00.1'
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''btn2'' and event_type == ''long_press''
          }}

          '
      sequence:
      - repeat:
          while:
          - condition: template
            value_template: '{{ true }}'
          sequence:
          - action: light.turn_on
            data:
              brightness_step: -25
            target:
              entity_id: light.light_chambre
          - delay: '00:00:00.1'
  mode: restart
