- id: '1774758823871'
  alias: Ouverture Volets - Quotidien (Pièce de vie)
  description: Ouvre le salon au lever du soleil, sauf en période de vacances.
  triggers:
  - trigger: sun
    event: sunrise
    offset: 01:00:00
  conditions:
  - condition: state
    entity_id: calendar.ha_calendar_ha_vacances
    state:
    - 'off'
  actions:
  - action: cover.open_cover
    data: {}
    target:
      entity_id: cover.groupe_cover_piece_de_vie
  mode: single
- id: '1774761593822'
  alias: Fermeture Volets - Quotidien
  description: Ferme tous les volets au coucher du soleil, sauf en période de vacances.
  triggers:
  - trigger: sun
    event: sunset
    offset: 0:30:00
  conditions:
  - condition: state
    entity_id: calendar.ha_calendar_ha_vacances
    state:
    - 'off'
  actions:
  - action: cover.close_cover
    target:
      entity_id:
      - cover.cover_bureau
      - cover.cover_chambre
      - cover.cover_mimilou
      - cover.groupe_cover_piece_de_vie
- id: '1774761654952'
  alias: Gestion Volets - Vacances (FINAL)
  description: 'Simulation de présence : ordre aléatoire, délais en minutes et déclencheurs
    solaires.'
  triggers:
  - trigger: sun
    event: sunrise
    offset: 00:20:00
    id: lever
  - trigger: sun
    event: sunset
    offset: -00:20:00
    id: coucher
  conditions:
  - condition: state
    entity_id: calendar.ha_calendar_ha_vacances
    state:
    - 'on'
  actions:
  - variables:
      volets: '{{ [''cover.cover_bureau'', ''cover.cover_chambre'', ''cover.cover_mimilou'',
        ''cover.groupe_cover_piece_de_vie''] | shuffle }}'
  - repeat:
      for_each: '{{ volets }}'
      sequence:
      - delay:
          minutes: '{{ range(1, 4) | random }}'
      - choose:
        - conditions:
          - condition: trigger
            id: lever
          sequence:
          - action: cover.open_cover
            target:
              entity_id: '{{ repeat.item }}'
        - conditions:
          - condition: trigger
            id: coucher
          sequence:
          - action: cover.close_cover
            target:
              entity_id: '{{ repeat.item }}'
  mode: single
