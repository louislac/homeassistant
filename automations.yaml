  triggers:
  - entity_id: sensor.sw_emil_switch_left_press_action_switch_left
    from: press
    to: released
    id: left
    trigger: state
  - entity_id: sensor.sw_emil_switch_right_press_action_switch_right
    from: press
    to: released
    id: right
    trigger: state
  actions:
